<svg width="264" height="228" viewBox="0 0 264 228" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ringL" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7F0F25"/>
      <stop offset="1" stop-color="#530918"/>
    </linearGradient>
    <linearGradient id="ringR" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#CD98A2"/>
      <stop offset="1" stop-color="#7F0F25"/>
